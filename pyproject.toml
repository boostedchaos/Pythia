[project]
name = "pythia"
version = "0.4.0"
description = "A private, always-on world-monitoring service: fuses live global feeds, tracks what CHANGED, and writes a cited daily brief. Forecasting is retired and archived (research mode only)."
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai-agents", "agent-api", "monitoring", "osint", "news-digest", "self-hosted", "homelab", "world-model", "real-time"]
authors = [{ name = "Jangles", email = "267653011+jangles-byte@users.noreply.github.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/jangles-byte/Pythia"
Repository = "https://github.com/jangles-byte/Pythia"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests", "engine"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:engine.*"]

[tool.pythia]
# placeholder for future tooling config
